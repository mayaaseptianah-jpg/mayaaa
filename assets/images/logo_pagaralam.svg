<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Perisai Luar -->
  <path d="M50 5 L88 20 C88 75 50 112 50 112 C50 112 12 75 12 20 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Lingkaran Emas Dalam -->
  <circle cx="50" cy="50" r="30" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <!-- Siluet Gunung Dempo -->
  <polygon points="50,28 32,58 68,58" fill="#047857"/>
  <polygon points="50,28 43,58 57,58" fill="#10B981"/>
  <!-- Salju/Awan Puncak -->
  <polygon points="50,28 46,38 54,38" fill="#FFFFFF"/>
  <!-- Gelombang Air Bersih -->
  <path d="M26 64 Q38 58 50 64 T74 64" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 70 Q40 64 50 70 T72 70" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pita Tulisan -->
  <rect x="20" y="85" width="60" height="14" rx="3" fill="#D97706"/>
  <text x="50" y="95" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PAGAR ALAM</text>
  <!-- Bintang Kemakmuran -->
  <polygon points="50,14 52,19 57,19 53,22 55,27 50,24 45,27 47,22 43,19 48,19" fill="#FBBF24"/>
</svg>

